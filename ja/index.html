<script>
// Android visitors see Google Play first.
if (/Android/i.test(navigator.userAgent)) {
  var stores = document.querySelector('.stores');

<script>
// Carries the channel a visitor came from (photocalapp.com/?utm_source=threads)
// into the store buttons, so installs can be counted per channel: Play's
// install referrer, and the App Store campaign link (pt is our provider id).
(function () {
  var source = new URLSearchParams(location.search).get('utm_source');
  if (!source || !/^[a-z0-9_.-]{1,40}$/i.test(source)) return;
  document.querySelectorAll('a[href*="play.google.com"]').forEach(function (a) {
    a.href = a.href.replace(/utm_source%3D[^&%]*/, 'utm_source%3D' + source);
  });
  document.querySelectorAll('a[href*="apps.apple.com"]').forEach(function (a) {
    var url = new URL(a.href);
    url.searchParams.set('pt', '118002225');
    url.searchParams.set('ct', source);
    url.searchParams.set('mt', '8');
    a.href = url.toString();
  });
})();
</script>
